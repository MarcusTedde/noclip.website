<!doctype html>
<html>
<head>
    <meta charset="utf8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>noclip</title>
    <meta name="description" content="A digital museum of video game levels">
    <link rel="icon" sizes="16x16" href="<%= require('./assets/icon.png') %>">
    <link rel="icon" sizes="64x64" href="<%= require('./assets/logo.png') %>">
    <style>
        @font-face {
            font-family: 'fontello';
            font-weight: normal;
            font-style: normal;
            src: url('<%= require("./assets/fontello.woff2") %>') format('woff2');
        }
        html, body { margin: 0; overflow: hidden; font-size: 100%; width: 100%; height: 100%; overscroll-behavior: none; }
        #Panel { max-height: var(--viewport-height, 100dvh); padding-top: calc(64px + env(safe-area-inset-top)) !important; }
        @media (max-width: 1050px) {
            :root { --bar-inset: 8px; }
            #Panel { padding: calc(64px + env(safe-area-inset-top)) 8px 80px max(8px, env(safe-area-inset-left)) !important; max-width: calc(100vw - 16px); max-height: var(--viewport-height, 100dvh); box-sizing: border-box; overflow: auto !important; }
            .viewer-panel { grid-auto-flow: row !important; gap: 0 !important; transition: none !important; }
            .viewer-panel-main { max-width: calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
            .viewer-panel-contents, .viewer-panel-header { width: min(440px, calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right))) !important; }
            .viewer-panel-extra > * { width: min(440px, calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right))) !important; max-height: 35dvh; overflow: auto; }
            .scroll-select { max-height: 35dvh; }
            .viewer-panel-contents > * { max-width: 100%; box-sizing: border-box; }
            #BottomBar { left: max(8px, env(safe-area-inset-left)) !important; right: max(8px, env(safe-area-inset-right)) !important; }
            .bottom-bar-panel { max-width: calc(100vw - 32px); max-height: calc(var(--viewport-height, 100dvh) - 96px); overflow: auto; }
            input, textarea, select { font-size: 16px !important; }
        }
        .menu-toggle { position: absolute; z-index: 20; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); min-height: 44px; padding: 0 16px; border: 1px solid #888; border-radius: 8px; background: #151515e6; color: white; font: 16px monospace; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
        .mobile-controls { display: none; position: absolute; z-index: 15; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(64px + env(safe-area-inset-bottom)); justify-content: space-between; align-items: end; pointer-events: none; }
        .mobile-controls[hidden] { display: none !important; }
        .mobile-controls button { width: 48px; height: 48px; padding: 0; color: white; background: #151515c9; border: 1px solid #aaa; border-radius: 10px; font: bold 18px monospace; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; pointer-events: auto; }
        .mobile-controls button[aria-pressed="true"] { background: #a51b1b; border-color: white; }
        .mobile-direction-pad { display: grid; grid-template: repeat(2, 48px) / repeat(3, 48px); gap: 6px; }
        .mobile-flight-pad { display: grid; gap: 6px; }
        .mobile-flight-pad button { width: 56px; font-size: 14px; }
        .mobile-control-hint { position: absolute; bottom: 170px; left: 0; right: 0; text-align: center; color: white; text-shadow: 0 1px 4px black; font: 12px sans-serif; pointer-events: none; }
        @media (max-width: 1050px), (any-pointer: coarse) { .mobile-controls { display: flex; } }
        @media (prefers-reduced-motion: reduce) { .viewer-panel, .viewer-panel * { transition: none !important; } }
        @media (any-pointer: coarse) {
            .viewer-panel-header { min-height: 44px; }
            .scroll-select .selector { min-height: 44px; display: flex !important; align-items: center; }
            #BottomBar > div > div { min-width: 44px; min-height: 44px; }
        }
    </style>
</head>
<body>
</body>
</html>
